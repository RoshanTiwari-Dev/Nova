name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (Vitest)
        run: npm run test

      - name: Build Next.js application
        run: npm run build
        env:
          DATABASE_URL: "postgres://mock_user:mock_password@ep-sample-pooler.us-east-2.aws.neon.tech/neondb?sslmode=require"
          AUTH_SECRET: "ci-secret-32-characters-minimum-length-key"
          AUTH_URL: "http://localhost:3000"
          OPENAI_API_KEY: "sk-mock-ci-key"
          JUDGE0_URL: "https://ce.judge0.com"
          CRON_SECRET: "ci-cron-secret-12345"
          ADMIN_EMAILS: "admin@novacode.dev"
